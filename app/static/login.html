<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F7F5F0">
  <meta name="robots" content="noindex, nofollow">
  <title>Logga in · Klimathemmet AI Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27%3E%3Crect width=%2724%27 height=%2724%27 rx=%276%27 fill=%27%23193D2D%27/%3E%3Cpath fill=%27white%27 d=%27M12 5 5 11h2v7h4v-4h2v4h4v-7h2l-7-6Z%27/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body class="login-page">
  <main class="login-wrap">
    <div class="login-brand">
      <span class="brand-logo" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 3 2 11h3v9h5v-6h4v6h5v-9h3L12 3Zm0 5.2c1.4 1.6 2.3 2.9 2.3 4 0 1.3-1 2.3-2.3 2.3s-2.3-1-2.3-2.3c0-1.1.9-2.4 2.3-4Z"/></svg>
      </span>
      <div class="brand-name">Klimathemmet <strong>AI Studio</strong></div>
    </div>
    <form class="card login-card" id="loginForm">
      <h1>Logga in</h1>
      <label class="field">
        <span class="label">Användarnamn</span>
        <input id="user" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      </label>
      <label class="field">
        <span class="label">Lösenord</span>
        <input id="password" type="password" autocomplete="current-password" required>
      </label>
      <p class="login-error" id="loginError" role="alert" hidden></p>
      <button class="btn btn-primary btn-block" type="submit">Logga in</button>
    </form>
  </main>
  <script src="/static/login.js"></script>
</body>
</html>
